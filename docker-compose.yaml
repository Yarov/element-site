services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: elementspa-app
    restart: unless-stopped
    environment:
      TZ: America/Mexico_City
      DATABASE_URL: postgresql://elementspa@postgres:5432/elementspa
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_TRUST_HOST: "true"
      META_PIXEL_ID: ${META_PIXEL_ID:-931479589299640}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  postgres:
    image: postgres:16-alpine
    hostname: elementspa-db
    restart: unless-stopped
    environment:
      TZ: America/Mexico_City
      POSTGRES_DB: elementspa
      POSTGRES_USER: elementspa
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - elementspa-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10

volumes:
  elementspa-postgres:
