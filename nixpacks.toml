[variables]
NODE_ENV = "production"

[phases.setup]
# Next 16 + React 19 funcionan bien en Node 20/22. Mantén 22 si tu infra lo soporta.
nixPkgs = ["nodejs_22"]

[phases.install]
# Drizzle Kit corre al iniciar el release, por lo que también debe existir en runtime.
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
# La app no abre el puerto si la migración falla. Configura una sola réplica en
# Coolify mientras no se introduzca un lock de migración distribuido.
cmd = "npm run db:migrate && npm run start -- -p $PORT"
